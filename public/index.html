<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shack Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            950: '#022c22',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Header Style -->
    <header class="w-full border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 px-4 py-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="font-bold tracking-wider text-sm text-white uppercase">Shack</span>
            </div>
            <span class="text-[10px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-emerald-400 font-mono">v2.0 en ligne</span>
        </div>
    </header>

    <!-- Main Section -->
    <main class="max-w-md mx-auto w-full px-4 py-6 my-auto">
        
        <!-- Titre d'accueil -->
        <div class="mb-6">
            <h1 class="text-xl font-bold text-white tracking-tight">Générateur de comptes</h1>
            <p class="text-xs text-slate-400 mt-1">Sélectionne ton service et récupère ton accès instantanément.</p>
        </div>

        <!-- Carte de sélection principale -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-xl shadow-2xl relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <label for="serviceSelect" class="block text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-2">Service cible</label>
            
            <div class="relative mb-4">
                <select id="serviceSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition appearance-none">
                    <option value="">Chargement des stocks...</option>
                </select>
                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500 text-xs">▼</div>
            </div>

            <button onclick="generateAccount()" id="genBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-[0.98]">
                Générer le compte
            </button>
        </div>

        <!-- Résultat de la génération (Masqué par défaut) -->
        <div id="resultBox" class="hidden mt-4 bg-slate-900 border border-emerald-500/30 rounded-2xl p-5 animate-in fade-in duration-300">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-mono uppercase">Succès</span>
                <span id="serviceLabel" class="text-xs text-slate-400 uppercase font-mono"></span>
            </div>
            
            <div id="accountText" class="w-full bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 my-3 font-mono text-xs text-emerald-300 select-all break-all shadow-inner"></div>
            
            <button onclick="copyAccount()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                <span>Copier les identifiants</span>
            </button>
        </div>

        <!-- Message d'erreur -->
        <div id="errorBox" class="hidden mt-4 bg-rose-950/30 border border-rose-500/30 rounded-2xl p-4 text-center text-xs text-rose-300"></div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-slate-900/80">
        <p class="text-[11px] text-slate-500 font-medium">Créé avec style par <span class="text-slate-300">Shack</span></p>
    </footer>

    <script>
        async function fetchStock() {
            try {
                const res = await fetch('/api/stock');
                const data = await res.json();
                const select = document.getElementById('serviceSelect');
                select.innerHTML = '';

                const keys = Object.keys(data);
                if (keys.length === 0) {
                    select.innerHTML = '<option value="">Aucun service disponible</option>';
                    return;
                }

                keys.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service;
                    option.textContent = `${service.toUpperCase()} — (${data[service].count} dispo)`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function generateAccount() {
            const service = document.getElementById('serviceSelect').value;
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');
            const genBtn = document.getElementById('genBtn');

            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            if (!service) {
                errorBox.textContent = "Veuillez sélectionner un service valide.";
                errorBox.classList.remove('hidden');
                return;
            }

            genBtn.disabled = true;
            genBtn.textContent = "Génération en cours...";

            try {
                const res = await fetch('/api/gen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorBox.textContent = data.error || "Erreur lors de la génération.";
                    errorBox.classList.remove('hidden');
                    genBtn.disabled = false;
                    genBtn.textContent = "Générer le compte";
                    return;
                }

                document.getElementById('serviceLabel').textContent = data.service;
                document.getElementById('accountText').textContent = data.account;
                resultBox.classList.remove('hidden');
                fetchStock();
            } catch (e) {
                errorBox.textContent = "Erreur de connexion au serveur.";
                errorBox.classList.remove('hidden');
            } finally {
                genBtn.disabled = false;
                genBtn.textContent = "Générer le compte";
            }
        }

        function copyAccount() {
            const text = document.getElementById('accountText').textContent;
            navigator.clipboard.writeText(text);
            alert("Identifiants copiés dans le presse-papier !");
        }

        fetchStock();
    </script>
</body>
</html>
