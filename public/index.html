<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shack • Store & Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.2s ease; }
        .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Bannière Restock -->
    <div class="bg-emerald-950/60 border-b border-emerald-500/20 py-2 px-4">
        <div class="max-w-md mx-auto flex items-center justify-between text-[11px]">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-emerald-400 font-bold uppercase tracking-wider">RESTOCK ACTIF</span>
            </div>
            <span class="text-slate-400 font-mono">Reset dans : <strong id="countdown" class="text-white">03h 45m</strong></span>
        </div>
    </div>

    <!-- Header -->
    <header class="max-w-md mx-auto w-full px-4 py-4 flex items-center justify-between border-b border-slate-900">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center font-extrabold text-slate-950 shadow-lg shadow-emerald-500/20">S</div>
            <span class="font-extrabold tracking-wider text-sm uppercase">SHACK STORE</span>
        </div>
        <span class="text-[10px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-emerald-400 font-mono">v2.5 PRO</span>
    </header>

    <!-- Content -->
    <main class="max-w-md mx-auto w-full px-4 py-6 space-y-5 flex-grow">
        
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">Services Disponibles</h1>
            <p class="text-xs text-slate-400 mt-0.5">Clique sur un service ci-dessous pour générer.</p>
        </div>

        <!-- Grille de stock -->
        <div id="servicesGrid" class="grid grid-cols-2 gap-3">
            <div class="col-span-2 text-center py-6 glass-panel rounded-2xl text-xs text-slate-400">Chargement des stocks...</div>
        </div>

        <!-- Panneau de sélection & Génération -->
        <div class="glass-panel rounded-2xl p-5 shadow-2xl border border-slate-800">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Sélection</span>
                <span id="selectedServiceBadge" class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">AUCUN</span>
            </div>

            <button onclick="generateAccount()" id="genBtn" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider cursor-not-allowed transition">
                Sélectionne un service
            </button>

            <!-- Résultat -->
            <div id="resultBox" class="hidden mt-4 bg-slate-950 border border-emerald-500/40 rounded-xl p-4">
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 font-mono px-2 py-0.5 rounded uppercase">Succès</span>
                <div id="accountText" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 my-2 font-mono text-xs text-emerald-300 select-all break-all"></div>
                <button onclick="copyAccount()" class="w-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 text-xs font-semibold py-2.5 rounded-lg">Copier l'identifiant</button>
            </div>

            <div id="errorBox" class="hidden mt-4 bg-rose-950/40 border border-rose-500/30 rounded-xl p-3 text-center text-xs text-rose-300"></div>
        </div>

        <!-- Flux d'activité -->
        <div class="glass-panel rounded-2xl p-4 border border-slate-800/60">
            <div class="flex items-center space-x-2 mb-3">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Activité récente</span>
            </div>
            <div id="activityList" class="space-y-2 max-h-32 overflow-y-auto text-xs">
                <div class="text-slate-500 text-center py-2">En attente de générations...</div>
            </div>
        </div>

    </main>

    <footer class="max-w-md mx-auto w-full text-center py-4 border-t border-slate-900 text-[11px] text-slate-500">
        Shack System • Tous droits réservés
    </footer>

    <script>
        let currentService = null;

        function startTimer() {
            let t = 14200;
            setInterval(() => {
                t = t > 0 ? t - 1 : 14200;
                let h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
                document.getElementById('countdown').textContent = `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
            }, 1000);
        }

        async function fetchStock() {
            try {
                const res = await fetch('/api/stock');
                const data = await res.json();
                const grid = document.getElementById('servicesGrid');
                grid.innerHTML = '';

                const keys = Object.keys(data);
                if (keys.length === 0) {
                    grid.innerHTML = '<div class="col-span-2 text-center py-6 glass-panel rounded-2xl text-xs text-slate-400">Aucun stock dans stock.json</div>';
                    return;
                }

                keys.forEach(service => {
                    const count = data[service].count;
                    const isSelected = currentService === service;
                    const card = document.createElement('div');
                    card.className = `glass-card p-3.5 rounded-2xl cursor-pointer ${isSelected ? 'border-emerald-500 bg-emerald-500/10' : ''}`;
                    card.onclick = () => { if(count > 0) selectService(service); };
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-sm capitalize text-white">${service}</span>
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full ${count > 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">${count} dispo</span>
                        </div>
                        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full" style="width: ${Math.min(count * 10, 100)}%"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        function selectService(service) {
            currentService = service;
            document.getElementById('selectedServiceBadge').textContent = service.toUpperCase();
            const btn = document.getElementById('genBtn');
            btn.disabled = false;
            btn.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 transition cursor-pointer";
            btn.textContent = `GÉNÉRER (${service.toUpperCase()})`;
            fetchStock();
        }

        async function generateAccount() {
            if (!currentService) return;
            const res = await fetch('/api/gen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ service: currentService })
            });
            const data = await res.json();
            if (!res.ok) {
                document.getElementById('errorBox').textContent = data.error;
                document.getElementById('errorBox').classList.remove('hidden');
                return;
            }
            document.getElementById('accountText').textContent = data.account;
            document.getElementById('resultBox').classList.remove('hidden');
            
            const list = document.getElementById('activityList');
            if(list.children.length === 1 && list.children[0].classList.contains('text-slate-500')) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = "flex justify-between text-slate-300 py-1 border-b border-slate-900";
            item.innerHTML = `<span>Compte <b>${data.service}</b> généré</span> <span class="text-emerald-400 font-mono">À l'instant</span>`;
            list.insertBefore(item, list.firstChild);

            fetchStock();
        }

        function copyAccount() {
            navigator.clipboard.writeText(document.getElementById('accountText').textContent);
            alert("Copié !");
        }

        startTimer();
        fetchStock();
    </script>
</body>
</html>
